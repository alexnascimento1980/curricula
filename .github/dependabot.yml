version: 2
updates:
  # Para não acumular dezenas de branches/PRs: as atualizações de cada
  # ecossistema são agrupadas (um único PR com todas as minor/patch) e rodam
  # uma vez por mês. Versões major continuam em PRs separados, porque podem
  # quebrar coisas (ex.: o ruff mudou as regras padrão numa release e quebrou
  # o CI). Combine com "Automatically delete head branches" em
  # Settings → General do GitHub, para o branch sumir sozinho após o merge.

  # Dependências Python do backend (Flask, ruff/black/isort, WeasyPrint...).
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "backend"
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]

  # Capacitor (app Android) — package.json da raiz.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "frontend"
    groups:
      capacitor-minor-patch:
        update-types: ["minor", "patch"]

  # frontend-react/ é um projeto Node independente (package.json próprio).
  - package-ecosystem: "npm"
    directory: "/frontend-react"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "frontend-react"
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]

  # Actions dos workflows (checkout, setup-python, setup-node...).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
