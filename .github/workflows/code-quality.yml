name: Code Quality

on:
  push:

  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: |
          pip install ruff==0.16.0 black==26.5.1 isort==8.0.1

      - run: ruff check .

      - run: black --check .

      - run: isort --check-only .

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - run: npm run lint

      - run: npm test

      # frontend-react/ é o novo frontend em migração incremental (React +
      # TypeScript) — projeto Node independente, com seu próprio
      # package.json, então cada passo roda com working-directory dedicado.
      - name: Instalar dependências do frontend-react
        working-directory: frontend-react
        run: npm install

      - name: Lint do frontend-react
        working-directory: frontend-react
        run: npm run lint

      - name: Typecheck do frontend-react
        working-directory: frontend-react
        run: npx tsc -b

      - name: Testes do frontend-react
        working-directory: frontend-react
        run: npm test

      - name: Build do frontend-react
        working-directory: frontend-react
        run: npm run build
