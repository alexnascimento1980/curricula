name: Tests

on:
  push:

  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # WeasyPrint precisa de Pango/HarfBuzz/Fontconfig (os testes renderizam PDF de verdade).
      - name: Instalar bibliotecas de sistema do WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libharfbuzz-subset0 libfontconfig1 fonts-liberation shared-mime-info

      - run: pip install -r backend/requirements-dev.txt

      - name: Testes do backend (pytest)
        run: pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Testes e build do frontend-react
        working-directory: frontend-react
        run: |
          npm install
          npm test
          npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar bibliotecas de sistema do WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libharfbuzz-subset0 libfontconfig1 fonts-liberation shared-mime-info

      - run: pip install -r backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Testes ponta a ponta: Flask servindo o build do React num Chrome real
      # (o Chrome já vem instalado no runner ubuntu-latest).
      - name: Build e testes E2E
        working-directory: frontend-react
        run: |
          npm install
          npm run build
          npm run test:e2e
